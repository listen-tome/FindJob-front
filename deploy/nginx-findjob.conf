# =============================================================================
# OfferPilot 上线配置：前端 findjob.aicaipu.top 反向代理后端 api.findjob.aicaipu.top
#
# 用途：把下面「必须新增的片段」粘贴到宝塔面板
#   网站 → findjob.aicaipu.top → 设置 → 配置文件（nginx）
# 的 server { ... } 内部，位置放在 `location /` 之前、`include enable-php-*.conf`
# 之类语句之后即可。保存后宝塔会自动 reload nginx，前端不用重新构建。
#
# 为什么需要它：
#   前端打包后的接口前缀是相对路径 `/api`（见 src/api/http.ts），所以浏览器会请求
#   http://findjob.aicaipu.top/api/... 。如果该站点没有把 /api 转发给 Spring Boot，
#   nginx 会走 SPA 兜底返回 index.html，axios 拿到的不是 JSON，页面就报
#   「网络连接异常，请检查后端服务是否启动」。
#
# 为什么还要删掉 Origin 头：
#   浏览器对 POST/PUT/PATCH/DELETE 会带上 Origin: http://findjob.aicaipu.top，
#   nginx 默认会把它原样转发给后端，而后端 CORS 白名单里只有
#   https://findjob.aicaipu.top，于是 Spring 直接回 403 "Invalid CORS request"。
#   同源反代时把 Origin 清空后，后端视其为非跨域请求，就不会再拦。
#   （本项目用 localStorage + Bearer Token，不依赖 Cookie，所以去掉 Origin
#     不会带来 CSRF 风险。）
# =============================================================================

# ------------------------------ 必须新增的片段 ------------------------------
location ^~ /api/ {
    # 也可以用 http://127.0.0.1:8080/api/ 直连本机 Spring Boot（前提是后端就在同一台机器）
    proxy_pass http://api.findjob.aicaipu.top/api/;

    proxy_http_version 1.1;
    proxy_set_header Host              api.findjob.aicaipu.top;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 关键：同源反代去掉 Origin，避免后端 CORS 过滤器返回 403
    proxy_set_header Origin "";

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;

    # 简历上传接口需要，后端限制 10MB
    client_max_body_size  10m;
}
# ---------------------------------------------------------------------------

