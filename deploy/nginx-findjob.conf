# ============================== 备选方案（二选一） ==============================
# 方案 B：不做反向代理，让前端直接跨域调用后端。
#   1) 新建 .env.production，写入：
#        VITE_API_BASE_URL=http://api.findjob.aicaipu.top
#   2) 重新 npm run build，把 dist 上传覆盖服务器上的前端目录
#   3) 后端 CorsConfig 的 allowedOrigins 增加：
#        "http://findjob.aicaipu.top", "https://findjob.aicaipu.top",
#        "http://localhost:5173", "http://127.0.0.1:5173"
#   缺点：以后前后端任意一边换域名/上 HTTPS 都要同步改；且不带 Cookie，仍需注意
#        预检请求的开销。相对而言方案 A（同源反代）更省事，推荐 A。
# =============================================================================
